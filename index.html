<style>:root{--color-bg:#f3f6f7;--color-panel:#fff;--color-fg:#13202b;--color-fg-muted:#5a6a77;--color-border-line:#dce3e8;--color-ok:#1d7f4e;--color-warn:#c2741f;--color-bad:#c23b2e;
--cds-font-size-body:14px;--cds-font-size-caption:12px;--cds-font-size-heading:17px;--cds-font-size-title:24px;--cds-font-weight-medium:600;
--cds-gap-xs:4px;--cds-gap-sm:8px;--cds-gap-md:12px;--cds-gap-lg:20px;--cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-md:14px;--cds-pad-lg:20px;--cds-radius:12px;

*{box-sizing:border-box}.gate{max-width:360px;margin:12vh auto;background:#13202b;color:#fff;border-radius:14px;padding:26px;text-align:center}.gate h1{font-size:18px;margin:6px 0 14px}.gate input{width:100%;padding:10px 12px;border-radius:8px;border:0;font-size:15px}.gate button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:8px;background:#0c7c86;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.gate .e{color:#ff9d93;font-size:13px;min-height:18px;margin-top:8px}

<div class="gate" id="gate"><div style="font-size:30px">🔒</div><h1>[AMZ] SEN | Báo cáo dự án</h1><input id="gp" type="password" placeholder="Nhập mật khẩu…" autocomplete="off"><button id="gb">Mở báo cáo</button><div class="e" id="ge"></div></div>
<div id="app" hidden><header class="top"><h1>[AMZ] SEN | Báo cáo dự án</h1><div class="s" id="sub"></div></header><nav class="tabs" id="tabs"></nav><main id="main"></main></div>
<script>/* Lớp thay thế bộ chạy Artifact: dash.data / dash.onData / dash.calc / dash.colors và d3 rút gọn */
(function(){
const DS={},CALC=[],CB=[];
const comma=n=>{const s=String(Math.abs(n)).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return s.join('.')};
const fmt=spec=>{const m=/^(\$)?(,)?(?:\.(\d))?f?$/.exec(spec)||[];const cur=m[1],cm=m[2],dp=m[3]==null?null:+m[3];
return v=>{if(v==null||isNaN(v))return'NaN';const neg=v<0;let a=Math.abs(+v);let s=dp==null?String(a):a.toFixed(dp);if(cm){const p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');s=p.join('.')}return(neg?'−':'')+(cur?'$':'')+s}};
const acc=(a,f)=>f?a.map((x,i)=>f(x,i)):a;
window.d3={format:fmt,sum:(a,f)=>acc(a,f).reduce((p,c)=>p+(+c||0),0),max:(a,f)=>{const v=acc(a,f).filter(x=>x!=null&&!isNaN(x));return v.length?Math.max(...v):undefined},min:(a,f)=>{const v=acc(a,f).filter(x=>x!=null&&!isNaN(x));return v.length?Math.min(...v):undefined}};
window.dash={colors:['#0c7c86','#c2741f','#6a5acd','#1d7f4e'],
data:id=>DS[id]?{status:'ok',data:DS[id]}:{status:'loading',data:[]},
onData:fn=>{CB.push(fn)},
calc:(id,o)=>{CALC.push([id,o])},
__load:function(data){Object.assign(DS,data);CALC.forEach(([id,o])=>{DS[id]=o.fn(...o.inputs.map(i=>DS[i]))});CB.forEach(f=>f())}};
})();
</script>
<script>
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(env,pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(env.s),iterations:env.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(env.i)},k,u8(env.c));return JSON.parse(new TextDecoder().decode(pt))}
const get=async n=>{try{const r=await fetch(n+'?v='+Date.now());return r.ok?await r.json():null}catch(e){return null}};
const TABS=[['ov','Overview'],['pl','P/L & Business Report'],['ba','Brand Analytics'],['amc','AMC']];
let ALL=null;
function show(id){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));
const m=document.getElementById('main');m.innerHTML='';
const src=ALL&&ALL[id];
if(!src){m.innerHTML='<div class="pend">Mục này chưa có dữ liệu.</div>';return}
if(src.pending){m.innerHTML='<div class="pend">'+src.pending+'</div>';return}
m.innerHTML=src.html;m.querySelectorAll('script').forEach(o=>{const n=document.createElement('script');n.textContent=o.textContent;o.replaceWith(n)});
if(src.data)dash.__load(src.data)}
async function open_(){const e=document.getElementById('ge');e.textContent='';const pw=document.getElementById('gp').value;
if(!(window.crypto&&crypto.subtle)){e.textContent='Trình duyệt không hỗ trợ giải mã. Hãy mở bằng Chrome, Edge hoặc Safari qua https.';return}
e.textContent='Đang giải mã…';
const ed=await get('data.enc');
try{ALL=ed?await dec(ed,pw):null}catch(x){ALL=null}
if(!ALL){e.textContent='Sai mật khẩu hoặc dữ liệu chưa sẵn sàng.';return}
document.getElementById('gate').hidden=true;document.getElementById('app').hidden=false;
document.getElementById('sub').textContent=(ALL.ov&&ALL.ov.sub)||'Ngày ghi D/M, theo giờ US.';
const t=document.getElementById('tabs');TABS.forEach(([id,l])=>{const b=document.createElement('button');b.dataset.t=id;b.textContent=l;b.onclick=()=>show(id);t.appendChild(b)});
show('ov')}
document.getElementById('gb').onclick=open_;document.getElementById('gp').addEventListener('keydown',e=>{if(e.key==='Enter')open_()});
</script></body></html>
